name: Verify Windows candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Verify interpreter and install hash-locked wheels
        shell: pwsh
        run: |
          python -B -c "import sys; sys.path.insert(0, 'scripts'); import build; print(build.validate_runtime())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Client tests
        run: python -B -m unittest discover -s client -p "test_*.py"
      - name: Build and provenance tests
        run: python -B -m unittest discover -s scripts -p "test_build.py"
      - name: Build unsigned candidate
        run: python -B scripts/build.py
      - name: Offline smoke check of actual executable
        run: python -B scripts/test_built_runtime.py
      - name: Verify candidate and public repository boundary
        run: python -B scripts/check_release.py
      - name: Upload candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xyquant-windows-candidate-${{ github.sha }}
          path: plugins/xyquant-factors/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
